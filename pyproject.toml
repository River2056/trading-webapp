[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-trading-monolith"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pwdlib[argon2]>=0.2,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build]
include = [
  "backend/**/*.py",
  "backend/migrations/*.sql",
]
exclude = [
  "backend/tests/**",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/app"]
exclude = ["^\\.venv/", "^frontend/"]
